<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER MARIO BROS - Five Nights at the Castle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
#ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ========== CONFIG ==========
const W = 800, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const PALETTE = {
  black: '#000000', white: '#ffffff', red: '#cc0000', darkred: '#880000',
  green: '#00aa00', darkgreen: '#005500', blue: '#0000cc', yellow: '#ffcc00',
  brown: '#885522', darkbrown: '#553311', gray: '#888888', darkgray: '#444444',
  lightgray: '#bbbbbb', skin: '#ffaa77', orange: '#ff8800', purple: '#8800aa',
  pink: '#ff66aa', cyan: '#00cccc', brick: '#aa4400', darkbrick: '#772200',
  eyeblack: '#110000', metal: '#666688', darkmetal: '#333355', rust: '#995533',
  wire: '#44ff44', blood: '#990000', static1: '#aaaaaa', static2: '#555555'
};

const PAL = Object.values(PALETTE);

const NIGHTS = [
  { duration: 90, speedMult: 1.0, powerDrain: 0.22, aggression: [2, 0, 0], label: 'NIGHT 1' },
  { duration: 90, speedMult: 1.2, powerDrain: 0.25, aggression: [3, 2, 0], label: 'NIGHT 2' },
  { duration: 90, speedMult: 1.5, powerDrain: 0.28, aggression: [4, 3, 2], label: 'NIGHT 3' },
  { duration: 90, speedMult: 1.8, powerDrain: 0.32, aggression: [5, 4, 4], label: 'NIGHT 4' },
  { duration: 90, speedMult: 2.2, powerDrain: 0.38, aggression: [6, 5, 5], label: 'NIGHT 5' },
];

const ROOMS = [
  { name: 'Main Hall', x: 200, y: 50 },
  { name: 'Pipe Room', x: 50, y: 150 },
  { name: 'Throne Room', x: 350, y: 150 },
  { name: 'Kitchen', x: 50, y: 250 },
  { name: 'Dungeon', x: 350, y: 250 },
  { name: 'Left Hall', x: 125, y: 350 },
  { name: 'Right Hall', x: 275, y: 350 },
  { name: 'Office', x: 200, y: 430 },
];

// Animatronic paths to office
const BOWSER_PATH = [0, 1, 3, 5, 7];  // Main->Pipe->Kitchen->LeftHall->Office
const TOAD_PATH   = [0, 2, 4, 6, 7];  // Main->Throne->Dungeon->RightHall->Office
const LUIGI_PATH  = [0, 2, 1, 3, 5, 6, 7]; // Erratic path

// ========== AUDIO ==========
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNoise(duration, volume, freq) {
  if (!audioCtx) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * volume;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.value = volume;
  src.connect(gain).connect(audioCtx.destination);
  src.start();
}

function playStatic() { playNoise(0.3, 0.15); }

function playJumpScare() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 1.0);
  playNoise(0.5, 0.4);
}

function playDrone() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = 55;
  gain.gain.value = 0.06;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  return { stop: () => { gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.stop(audioCtx.currentTime + 0.6); }};
}

function playDoorSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square'; osc.frequency.value = 80;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function playHeartbeat(rate) {
  if (!audioCtx) return;
  for (let i = 0; i < 2; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = 40;
    const t = audioCtx.currentTime + i * 0.2;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.2 * rate, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
  }
}

function playFootstep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.value = 60 + Math.random() * 30;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

// ========== GAME STATE ==========
const STATE = { TITLE: 0, NIGHT_INTRO: 1, GAMEPLAY: 2, JUMPSCARE: 3, NIGHT_COMPLETE: 4, GAME_OVER: 5, ENDING: 6 };

let gameState = STATE.TITLE;
let currentNight = 0;
let timeRemaining = 90;
let power = 100;
let currentCamera = -1; // -1 = office view
let leftDoorClosed = false;
let rightDoorClosed = false;
let leftLightOn = false;
let rightLightOn = false;
let stateTimer = 0;
let staticTimer = 0;
let staticActive = false;
let glitchIntensity = 0;
let titleTimer = 0;
let jumpscareAnimatronic = null;
let jumpscareTimer = 0;
let nightsCompleted = 0;
let drone = null;
let heartbeatTimer = 0;
let creepyMessages = [];
let messageTimer = 0;
let luigiStareTime = 0;
let powerOutTimer = 0;
let powerOut = false;
let endingTimer = 0;

const CREEPY_TEXTS = [
  'DO YOU REMEMBER ME',
  'HE SEES YOU',
  'IT\'S NOT A GAME ANYMORE',
  'WHY DID YOU LEAVE ME',
  'PLAYER 2 HAS JOINED',
  'GAME OVER GAME OVER GAME OVER',
  'I WAS ALWAYS HERE',
  'CAN YOU HEAR ME',
  'THE PIPES ARE WATCHING',
  'DON\'T LOOK AT HIM',
  'ERROR: SOUL NOT FOUND',
  'SAVE CORRUPTED',
];

// Animatronics
let animatronics = [];
function resetAnimatronics() {
  const n = NIGHTS[currentNight];
  animatronics = [
    { name: 'BOWSER', room: 0, path: BOWSER_PATH, pathIdx: 0, aggression: n.aggression[0], moveTimer: 0, moveInterval: 8, side: 'left', color: '#44aa00' },
    { name: 'TOAD', room: 0, path: TOAD_PATH, pathIdx: 0, aggression: n.aggression[1], moveTimer: 0, moveInterval: 6, side: 'right', color: '#ff4444' },
    { name: 'LUIGI', room: 0, path: LUIGI_PATH, pathIdx: 0, aggression: n.aggression[2], moveTimer: 0, moveInterval: 10, side: 'left', color: '#00cc44' },
  ];
}

// ========== DRAWING HELPERS ==========
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawText(text, x, y, color, size, align) {
  ctx.fillStyle = color || '#fff';
  ctx.font = (size || 16) + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

function drawTextGlitch(text, x, y, color, size, intensity) {
  for (let i = 0; i < text.length; i++) {
    const ox = (Math.random() - 0.5) * intensity * 4;
    const oy = (Math.random() - 0.5) * intensity * 2;
    const c = Math.random() < intensity * 0.3 ? '#ff0000' : color;
    drawText(text[i], x + i * (size * 0.6) + ox, y + oy, c, size);
  }
}

// ========== ROOM DRAWING ==========
function drawBrickWall(x, y, w, h) {
  ctx.fillStyle = '#331100';
  ctx.fillRect(x, y, w, h);
  for (let row = 0; row < h / 20; row++) {
    for (let col = 0; col < w / 40 + 1; col++) {
      const bx = x + col * 40 + (row % 2) * 20;
      const by = y + row * 20;
      ctx.fillStyle = '#' + (Math.random() < 0.1 ? '552200' : (Math.random() < 0.2 ? '663300' : '884400'));
      ctx.fillRect(bx + 1, by + 1, 38, 18);
    }
  }
}

function drawRoom(roomIdx) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  const room = ROOMS[roomIdx];

  // Draw themed background per room
  switch (roomIdx) {
    case 0: // Main Hall
      drawBrickWall(0, 0, W, H);
      ctx.fillStyle = '#222';
      ctx.fillRect(100, 100, 600, 400);
      drawBrickWall(110, 110, 580, 380);
      // Chandelier
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(370, 20, 60, 10);
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(375 + i * 12, 30, 4, 20 + Math.sin(Date.now()/500+i)*5);
        ctx.fillStyle = '#ff8800'; ctx.fillRect(375 + i*12, 25, 4, 8); ctx.fillStyle = '#ffcc00';
      }
      drawText('MAIN HALL', 320, 520, '#666', 20);
      break;
    case 1: // Pipe Room
      drawBrickWall(0, 0, W, H);
      // Green pipes
      for (let i = 0; i < 4; i++) {
        const px = 80 + i * 180;
        ctx.fillStyle = '#00aa00'; ctx.fillRect(px, 200, 60, 300);
        ctx.fillStyle = '#00cc00'; ctx.fillRect(px - 8, 190, 76, 30);
        ctx.fillStyle = '#008800'; ctx.fillRect(px + 10, 210, 40, 280);
      }
      drawText('PIPE ROOM', 330, 520, '#666', 20);
      break;
    case 2: // Throne Room
      drawBrickWall(0, 0, W, H);
      // Throne
      ctx.fillStyle = '#880000'; ctx.fillRect(320, 150, 160, 300);
      ctx.fillStyle = '#aa0000'; ctx.fillRect(330, 100, 140, 60);
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(390, 110, 20, 20);
      ctx.fillStyle = '#660000'; ctx.fillRect(340, 300, 120, 30);
      drawText('THRONE ROOM', 310, 520, '#666', 20);
      break;
    case 3: // Kitchen
      drawBrickWall(0, 0, W, H);
      ctx.fillStyle = '#333'; ctx.fillRect(50, 300, 700, 200);
      ctx.fillStyle = '#444'; ctx.fillRect(50, 280, 700, 25);
      // Pots
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#888'; ctx.fillRect(150 + i*200, 230, 80, 50);
        ctx.fillStyle = '#666'; ctx.fillRect(160 + i*200, 220, 60, 15);
      }
      drawText('KITCHEN', 345, 520, '#666', 20);
      break;
    case 4: // Dungeon
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);
      // Chains
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = '#555';
        for (let j = 0; j < 8; j++) {
          ctx.fillRect(100+i*150, 20+j*40, 12, 30);
        }
      }
      // Bars
      ctx.fillStyle = '#444';
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(50 + i * 100, 0, 8, H);
      }
      drawText('DUNGEON', 345, 520, '#444', 20);
      break;
    case 5: // Left Hall
      drawBrickWall(0, 0, W, H);
      // Hallway perspective
      ctx.fillStyle = '#1a0a00';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(250, 150); ctx.lineTo(250, 450); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = '#1a0a00';
      ctx.beginPath();
      ctx.moveTo(W, 0); ctx.lineTo(550, 150); ctx.lineTo(550, 450); ctx.lineTo(W, H); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.fillRect(250, 150, 300, 300);
      drawText('LEFT HALLWAY', 310, 520, '#666', 20);
      break;
    case 6: // Right Hall
      drawBrickWall(0, 0, W, H);
      ctx.fillStyle = '#1a0a00';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(250, 150); ctx.lineTo(250, 450); ctx.lineTo(0, H); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W, 0); ctx.lineTo(550, 150); ctx.lineTo(550, 450); ctx.lineTo(W, H); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.fillRect(250, 150, 300, 300);
      // Painting on wall
      ctx.fillStyle = '#553300'; ctx.fillRect(340, 200, 120, 90);
      ctx.fillStyle = '#442200'; ctx.fillRect(345, 205, 110, 80);
      ctx.fillStyle = '#000'; ctx.fillRect(380, 220, 40, 50); // dark figure
      drawText('RIGHT HALLWAY', 300, 520, '#666', 20);
      break;
  }
}

// ========== ANIMATRONIC DRAWING ==========
function drawAnimatronicInRoom(anim, roomIdx) {
  if (anim.room !== roomIdx || anim.aggression <= 0) return;

  const cx = 400, cy = 300;
  const s = 4; // pixel scale

  if (anim.name === 'BOWSER') {
    // Bowser animatronic - big, green, metallic
    ctx.fillStyle = '#336600';
    ctx.fillRect(cx-40, cy-60, 80, 100); // body
    ctx.fillStyle = '#448800';
    ctx.fillRect(cx-30, cy-90, 60, 40); // head
    // Hollow eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-22, cy-82, 16, 12);
    ctx.fillRect(cx+6, cy-82, 16, 12);
    // Red eye glow
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-18, cy-78, 8, 4);
    ctx.fillRect(cx+10, cy-78, 8, 4);
    // Metal jaw
    ctx.fillStyle = '#666688';
    ctx.fillRect(cx-25, cy-55, 50, 15);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) ctx.fillRect(cx-20+i*8, cy-55, 4, 8); // teeth
    // Shell
    ctx.fillStyle = '#334400';
    ctx.fillRect(cx-35, cy-40, 70, 60);
    // Spikes
    ctx.fillStyle = '#888';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(cx-25+i*22, cy-50, 12, 12);
    }
    // Exposed wires
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(cx+30, cy-20, 3, 30);
    ctx.fillRect(cx-33, cy-10, 3, 25);
  } else if (anim.name === 'TOAD') {
    // Toad animatronic - small, mushroom cap cracked
    ctx.fillStyle = '#ffaaaa';
    ctx.fillRect(cx-15, cy-20, 30, 40); // body
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(cx-25, cy-60, 50, 45); // mushroom cap
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-18, cy-55, 14, 14);
    ctx.fillRect(cx+4, cy-55, 14, 14);
    // Crack in cap
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx+10, cy-60); ctx.lineTo(cx+5, cy-35); ctx.lineTo(cx+15, cy-25); ctx.stroke();
    // Eyes - one dangling
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-12, cy-25, 10, 8);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-10, cy-23, 6, 4);
    // Dangling eye
    ctx.fillStyle = '#888';
    ctx.fillRect(cx+5, cy-22, 3, 15);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx+2, cy-7, 10, 8);
    // Sharp teeth
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 4; i++) ctx.fillRect(cx-8+i*5, cy-16, 3, 6);
  } else if (anim.name === 'LUIGI') {
    // Luigi animatronic - half face missing
    ctx.fillStyle = '#00aa44';
    ctx.fillRect(cx-20, cy-30, 40, 70); // body
    // Head
    ctx.fillStyle = '#ffaa77';
    ctx.fillRect(cx-18, cy-70, 36, 45); // face
    // Half missing - endoskeleton
    ctx.fillStyle = '#444466';
    ctx.fillRect(cx, cy-70, 18, 45);
    ctx.fillStyle = '#333355';
    ctx.fillRect(cx+3, cy-65, 4, 8);
    ctx.fillRect(cx+10, cy-60, 4, 12);
    // Good eye
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-14, cy-60, 10, 8);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-12, cy-58, 6, 4);
    // Endoskeleton eye
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx+5, cy-60, 8, 8);
    // Hat
    ctx.fillStyle = '#008833';
    ctx.fillRect(cx-20, cy-78, 36, 12);
    ctx.fillRect(cx-14, cy-88, 24, 12);
    // L emblem
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-6, cy-86, 8, 8);
    ctx.fillStyle = '#008833';
    drawText('L', cx-5, cy-87, '#008833', 8);
    // Exposed wires from missing half
    ctx.fillStyle = '#44ff44';
    ctx.fillRect(cx+14, cy-55, 2, 20);
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(cx+17, cy-50, 2, 15);
  }
}

// ========== OFFICE DRAWING ==========
function drawOffice() {
  // Floor
  ctx.fillStyle = '#221100';
  ctx.fillRect(0, 350, W, 250);
  // Checkered floor
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 16; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#332211' : '#221100';
      ctx.fillRect(col * 50, 350 + row * 50, 50, 50);
    }
  }

  // Back wall
  drawBrickWall(100, 0, 600, 350);

  // Left wall perspective
  ctx.fillStyle = '#1a0800';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(100, 0); ctx.lineTo(100, 350); ctx.lineTo(0, H); ctx.fill();

  // Right wall perspective
  ctx.beginPath();
  ctx.moveTo(W, 0); ctx.lineTo(700, 0); ctx.lineTo(700, 350); ctx.lineTo(W, H); ctx.fill();

  // Left doorway
  ctx.fillStyle = leftDoorClosed ? '#554433' : '#080808';
  ctx.fillRect(20, 80, 90, 320);
  if (leftDoorClosed) {
    ctx.fillStyle = '#443322';
    ctx.fillRect(25, 85, 80, 310);
    ctx.fillStyle = '#666';
    ctx.fillRect(85, 230, 10, 20);
  }

  // Right doorway
  ctx.fillStyle = rightDoorClosed ? '#554433' : '#080808';
  ctx.fillRect(690, 80, 90, 320);
  if (rightDoorClosed) {
    ctx.fillStyle = '#443322';
    ctx.fillRect(695, 85, 80, 310);
    ctx.fillStyle = '#666';
    ctx.fillRect(705, 230, 10, 20);
  }

  // Lights
  if (leftLightOn) {
    ctx.fillStyle = 'rgba(255,255,150,0.15)';
    ctx.fillRect(0, 0, 200, H);
  }
  if (rightLightOn) {
    ctx.fillStyle = 'rgba(255,255,150,0.15)';
    ctx.fillRect(600, 0, 200, H);
  }

  // Check if animatronics at door
  for (const anim of animatronics) {
    if (anim.aggression <= 0) continue;
    const atDoor = anim.pathIdx >= anim.path.length - 2;
    if (atDoor && anim.side === 'left' && leftLightOn && !leftDoorClosed) {
      drawAnimatronicAtDoor(anim, 'left');
    }
    if (atDoor && anim.side === 'right' && rightLightOn && !rightDoorClosed) {
      drawAnimatronicAtDoor(anim, 'right');
    }
  }

  // Desk
  ctx.fillStyle = '#443322';
  ctx.fillRect(250, 400, 300, 20);
  ctx.fillRect(260, 420, 20, 80);
  ctx.fillRect(520, 420, 20, 80);

  // Monitor
  ctx.fillStyle = '#222';
  ctx.fillRect(340, 320, 120, 80);
  ctx.fillStyle = '#333';
  ctx.fillRect(345, 325, 110, 70);
  ctx.fillStyle = '#111';
  ctx.fillRect(390, 400, 20, 15);

  // Fan
  const fanAngle = Date.now() / 100;
  ctx.save();
  ctx.translate(600, 380);
  ctx.fillStyle = '#555';
  ctx.fillRect(-5, -5, 10, 40);
  ctx.rotate(fanAngle);
  ctx.fillStyle = '#888';
  for (let i = 0; i < 3; i++) {
    ctx.rotate(Math.PI * 2 / 3);
    ctx.fillRect(-3, -2, 25, 4);
  }
  ctx.restore();

  // Poster on wall (creepy mario)
  ctx.fillStyle = '#553322';
  ctx.fillRect(450, 50, 80, 100);
  ctx.fillStyle = '#442211';
  ctx.fillRect(455, 55, 70, 90);
  ctx.fillStyle = '#cc0000';
  ctx.fillRect(475, 70, 30, 20); // hat
  ctx.fillStyle = '#ffaa77';
  ctx.fillRect(475, 90, 30, 20); // face
  ctx.fillStyle = '#000';
  ctx.fillRect(480, 95, 8, 6); // eye
  ctx.fillRect(497, 95, 8, 6); // eye
  if (currentNight >= 2) {
    // Eyes go red on later nights
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(482, 97, 4, 2);
    ctx.fillRect(499, 97, 4, 2);
  }
}

function drawAnimatronicAtDoor(anim, side) {
  const x = side === 'left' ? 40 : 710;
  const y = 120;
  ctx.fillStyle = anim.color;
  ctx.fillRect(x, y, 60, 180);
  // Glowing eyes
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(x + 15, y + 20, 10, 8);
  ctx.fillRect(x + 35, y + 20, 10, 8);
  // Name
  drawText(anim.name, x, y + 190, '#ff0000', 10, 'left');
}

// ========== HUD ==========
function drawHUD() {
  // Power
  const powerColor = power > 50 ? '#00ff00' : power > 25 ? '#ffcc00' : '#ff0000';
  drawText('POWER', 20, 550, '#888', 14);
  ctx.fillStyle = '#333';
  ctx.fillRect(90, 550, 150, 16);
  ctx.fillStyle = powerColor;
  ctx.fillRect(90, 550, 150 * (power / 100), 16);
  drawText(Math.ceil(power) + '%', 250, 550, powerColor, 14);

  // Time
  const hoursLeft = timeRemaining / 15; // 90s / 6 hours = 15s per hour
  const hour = Math.min(5, Math.floor(6 - hoursLeft));
  const timeStr = hour === 0 ? '12 AM' : hour + ' AM';
  drawText(timeStr, 700, 20, '#fff', 28, 'left');

  // Night
  drawText(NIGHTS[currentNight].label, 20, 20, '#888', 18);

  // Camera/Office label
  if (currentCamera >= 0) {
    drawText('CAM ' + (currentCamera + 1) + ' - ' + ROOMS[currentCamera].name, W/2, 20, '#aaa', 16, 'center');
  } else {
    drawText('OFFICE', W/2, 20, '#aaa', 16, 'center');
  }

  // Controls help
  if (currentCamera < 0) {
    drawText('[Q] Left Door  [E] Right Door  [A] Left Light  [D] Right Light', W/2, H - 20, '#555', 11, 'center');
    drawText('[1-7] Cameras', W/2, H - 35, '#555', 11, 'center');

    // Door indicators
    drawText(leftDoorClosed ? 'LEFT DOOR: CLOSED' : 'LEFT DOOR: OPEN', 20, 420, leftDoorClosed ? '#ff4444' : '#44ff44', 12);
    drawText(rightDoorClosed ? 'RIGHT DOOR: CLOSED' : 'RIGHT DOOR: OPEN', 620, 420, rightDoorClosed ? '#ff4444' : '#44ff44', 12);
    drawText(leftLightOn ? 'LIGHT: ON' : 'LIGHT: OFF', 20, 440, leftLightOn ? '#ffff44' : '#666', 12);
    drawText(rightLightOn ? 'LIGHT: ON' : 'LIGHT: OFF', 680, 440, rightLightOn ? '#ffff44' : '#666', 12);
  } else {
    drawText('[SPACE] Back to Office  [1-7] Switch Camera', W/2, H - 20, '#555', 11, 'center');
  }
}

// ========== CAMERA MAP ==========
function drawCameraMap() {
  if (currentCamera < 0) return;

  const mapX = 580, mapY = 380, mapW = 200, mapH = 180;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(mapX, mapY, mapW, mapH);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(mapX, mapY, mapW, mapH);

  drawText('MAP', mapX + 80, mapY + 5, '#666', 12, 'center');

  // Draw rooms
  for (let i = 0; i < 7; i++) {
    const r = ROOMS[i];
    const rx = mapX + 20 + (r.x / 400) * 160;
    const ry = mapY + 20 + (r.y / 450) * 140;

    ctx.fillStyle = i === currentCamera ? '#ff4444' : '#333';
    ctx.fillRect(rx - 15, ry - 8, 30, 16);
    ctx.strokeStyle = i === currentCamera ? '#ff6666' : '#666';
    ctx.strokeRect(rx - 15, ry - 8, 30, 16);
    drawText((i + 1).toString(), rx - 3, ry - 6, '#fff', 10);

    // Show animatronic indicators
    for (const anim of animatronics) {
      if (anim.room === i && anim.aggression > 0) {
        ctx.fillStyle = anim.color;
        ctx.fillRect(rx + 12, ry - 6, 6, 6);
      }
    }
  }
}

// ========== GLITCH EFFECTS ==========
function applyGlitchEffects() {
  const intensity = glitchIntensity + currentNight * 0.05;

  // Screen tear
  if (Math.random() < intensity * 0.3) {
    const imgData = ctx.getImageData(0, 0, W, H);
    const y = Math.floor(Math.random() * H);
    const h = Math.floor(Math.random() * 30) + 5;
    const offset = Math.floor((Math.random() - 0.5) * 40);
    const slice = ctx.getImageData(0, y, W, Math.min(h, H - y));
    ctx.putImageData(slice, offset, y);
  }

  // Static overlay
  if (Math.random() < intensity * 0.2) {
    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;
    for (let i = 0; i < 500; i++) {
      const idx = Math.floor(Math.random() * data.length / 4) * 4;
      const v = Math.random() * 255;
      data[idx] = v; data[idx+1] = v; data[idx+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // Scanlines (VHS)
  if (currentNight >= 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for (let y = 0; y < H; y += 4) {
      ctx.fillRect(0, y, W, 2);
    }
  }

  // Color fringe
  if (Math.random() < intensity * 0.1) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.05;
    ctx.drawImage(canvas, 2, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // Creepy message flash
  if (messageTimer > 0) {
    messageTimer--;
    const msg = creepyMessages[0] || 'ERROR';
    const flicker = Math.random() > 0.3;
    if (flicker) {
      drawText(msg, W/2, H/2, 'rgba(255,0,0,0.7)', 30, 'center');
    }
  }
}

function applyStaticTransition() {
  if (!staticActive) return;
  staticTimer--;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 15000; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const v = Math.floor(Math.random() * 200);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(x, y, 2, 2);
  }
  drawText('LOADING CAM...', W/2, H/2, '#aaa', 20, 'center');
  if (staticTimer <= 0) staticActive = false;
}

// ========== JUMPSCARE ==========
function drawJumpscare() {
  jumpscareTimer--;
  const shake = 15 - jumpscareTimer * 0.2;

  ctx.save();
  ctx.translate((Math.random()-0.5)*shake*3, (Math.random()-0.5)*shake*3);

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const anim = jumpscareAnimatronic;
  const cx = W/2, cy = H/2;

  // Giant face
  if (anim.name === 'BOWSER') {
    ctx.fillStyle = '#336600';
    ctx.fillRect(cx-200, cy-200, 400, 350);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-120, cy-150, 80, 60);
    ctx.fillRect(cx+40, cy-150, 80, 60);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-100, cy-130, 40, 20);
    ctx.fillRect(cx+60, cy-130, 40, 20);
    ctx.fillStyle = '#666';
    ctx.fillRect(cx-150, cy-30, 300, 60);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 10; i++) ctx.fillRect(cx-140+i*30, cy-30, 15, 40);
  } else if (anim.name === 'TOAD') {
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(cx-180, cy-220, 360, 200);
    ctx.fillStyle = '#ffaaaa';
    ctx.fillRect(cx-120, cy-50, 240, 250);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-80, cy-10, 50, 40);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-70, cy, 30, 15);
    ctx.fillRect(cx+50, cy-20, 3, 60);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx+30, cy+35, 40, 35);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) ctx.fillRect(cx-50+i*18, cy+80, 10, 25);
  } else if (anim.name === 'LUIGI') {
    ctx.fillStyle = '#ffaa77';
    ctx.fillRect(cx-150, cy-180, 150, 300);
    ctx.fillStyle = '#444466';
    ctx.fillRect(cx, cy-180, 150, 300);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-100, cy-120, 50, 40);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx-90, cy-110, 30, 20);
    ctx.fillRect(cx+50, cy-120, 50, 40);
    ctx.fillStyle = '#008833';
    ctx.fillRect(cx-160, cy-220, 320, 50);
    // Wires everywhere
    ctx.fillStyle = '#44ff44';
    for (let i = 0; i < 8; i++) {
      ctx.fillRect(cx + Math.random()*140, cy-180+Math.random()*300, 3, 30+Math.random()*40);
    }
  }

  // Red flash
  if (jumpscareTimer % 4 < 2) {
    ctx.fillStyle = 'rgba(255,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  if (jumpscareTimer <= 0) {
    gameState = STATE.GAME_OVER;
    stateTimer = 0;
  }
}

// ========== STATE RENDERERS ==========
function drawTitle() {
  titleTimer += 0.016;

    ctx.fillStyle = '#332200';
    ctx.fillRect(200 + i * 80, 350, 40, 40);
    ctx.fillStyle = '#221100';
    drawText('?', 213 + i * 80, 358, '#443300', 20);
  }

  // Title text
  const glitch = Math.sin(titleTimer * 3) * 0.1 + 0.1;
  drawTextGlitch('SUPER MARIO BROS', W/2 - 220, 80, '#cc0000', 32, glitch);

  const subtitle = 'FIVE NIGHTS AT THE CASTLE';
  const chars = Math.min(subtitle.length, Math.floor(titleTimer * 4));
  const sub = subtitle.substring(0, chars);
  drawText(sub, W/2, 140, '#888', 18, 'center');
  if (Math.floor(titleTimer * 4) % 2 === 0 && chars < subtitle.length) {
    drawText('_', W/2 + chars * 5.4, 140, '#888', 18);
  }

  // Creepy Mario facing away, then turning
  const marioX = 380, marioY = 280;
  ctx.fillStyle = '#cc0000';
  ctx.fillRect(marioX, marioY - 30, 40, 15); // hat
  ctx.fillStyle = '#ffaa77';
  ctx.fillRect(marioX + 5, marioY - 15, 30, 25); // face

  if (titleTimer > 3) {
    // Turn around - show black eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(marioX + 10, marioY - 10, 10, 8);
    ctx.fillRect(marioX + 24, marioY - 10, 10, 8);
    if (titleTimer > 4) {
      // Blood from eyes
      ctx.fillStyle = '#880000';
      ctx.fillRect(marioX + 12, marioY - 2, 6, 12);
      ctx.fillRect(marioX + 26, marioY - 2, 6, 12);
    }
  }

  ctx.fillStyle = '#0000cc';
  ctx.fillRect(marioX + 2, marioY + 10, 36, 30); // overalls
  ctx.fillStyle = '#884400';
  ctx.fillRect(marioX + 5, marioY + 40, 12, 15); // shoes
  ctx.fillRect(marioX + 25, marioY + 40, 12, 15);

  // Start button

    const blink = Math.sin(titleTimer * 5) > 0;
    if (blink) {

    }

  // Occasional full glitch
  if (Math.random() < 0.02 && titleTimer > 2) {

  }

  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

function drawNightIntro() {
  stateTimer += 0.016;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const alpha = Math.min(1, stateTimer * 0.5);
  const label = NIGHTS[currentNight].label;
  drawText('12:00 AM', W/2, H/2 - 40, `rgba(255,255,255,${alpha})`, 40, 'center');
  drawText(label, W/2, H/2 + 20, `rgba(200,200,200,${alpha})`, 24, 'center');

  if (currentNight === 2) {
    if (stateTimer > 2) {
      drawText('Some things are best left unseen...', W/2, H/2 + 80, `rgba(255,0,0,${Math.min(1,(stateTimer-2)*0.5)})`, 14, 'center');
    }
  }
  if (currentNight === 4) {
    if (stateTimer > 1.5) {
      const g = Math.sin(stateTimer * 10) * 0.3;
      drawTextGlitch('THIS IS THE END', W/2 - 100, H/2 + 80, '#ff0000', 18, Math.abs(g));
    }
  }

  if (stateTimer > 3.5) {
    gameState = STATE.GAMEPLAY;
    stateTimer = 0;
    timeRemaining = NIGHTS[currentNight].duration;
    power = 100;
    currentCamera = -1;
    leftDoorClosed = false;
    rightDoorClosed = false;
    leftLightOn = false;
    rightLightOn = false;
    powerOut = false;
    powerOutTimer = 0;
    luigiStareTime = 0;
    resetAnimatronics();
    drone = playDrone();
  }
}

function drawNightComplete() {
  stateTimer += 0.016;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  drawText('6:00 AM', W/2, H/2 - 20, '#ffcc00', 48, 'center');

  if (stateTimer > 1) {
    drawText(NIGHTS[currentNight].label + ' COMPLETE', W/2, H/2 + 40, '#888', 20, 'center');
  }

  if (stateTimer > 4) {
    currentNight++;
    if (currentNight >= 5) {
      gameState = STATE.ENDING;
      stateTimer = 0;
      endingTimer = 0;
    } else {
      gameState = STATE.NIGHT_INTRO;
      stateTimer = 0;
    }
  }
}

function drawGameOver() {
  stateTimer += 0.016;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const glitch = Math.sin(stateTimer * 8) * 0.2;
  drawTextGlitch('GAME OVER', W/2 - 120, H/2 - 30, '#cc0000', 40, Math.abs(glitch));

  if (stateTimer > 1.5) {
    const blink = Math.sin(stateTimer * 4) > 0;
    if (blink) drawText('[ CLICK TO RETRY ]', W/2, H/2 + 40, '#888', 18, 'center');
  }

  // Static
  if (Math.random() < 0.05) applyGlitchEffects();
}

function drawEnding() {

  } else if (endingTimer < 7) {

    ctx.fillRect(cx+14, cy-19, 12, 30);

      ctx.putImageData(slice, Math.floor((Math.random()-0.5)*60), y);
    }
  } else if (endingTimer < 16) {

    const lines = [
      'I was always here.',
      'In every game you played.',
      'Watching. Waiting.',
      '',
      'You thought it was just a game?',
      'You thought you were safe?',
      '',
      'See you in your dreams.',
      '',
      '    - M',
    ];
    const charsPerLine = Math.floor((endingTimer - 12) * 25);
    let total = 0;
    for (let i = 0; i < lines.length; i++) {
      const remaining = charsPerLine - total;
      if (remaining <= 0) break;
      const text = lines[i].substring(0, remaining);
      drawText(text, 120, 120 + i * 28, '#ddd', 16);
      total += lines[i].length;
    }
  } else if (endingTimer < 20) {
    drawText('FIVE NIGHTS AT THE CASTLE', W/2, H/2 - 30, '#cc0000', 24, 'center');
    drawText('ALL NIGHTS COMPLETE', W/2, H/2 + 10, '#ffcc00', 18, 'center');
    drawText('[ CLICK TO RETURN TO TITLE ]', W/2, H/2 + 60, '#666', 14, 'center');
  } else {
    drawText('[ CLICK TO RETURN TO TITLE ]', W/2, H/2, '#888', 18, 'center');
  }

  // Scanlines always
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

// ========== GAME LOGIC ==========
function updateGameplay(dt) {
  const night = NIGHTS[currentNight];

  // Time
  timeRemaining -= dt;
  if (timeRemaining <= 0) {
    gameState = STATE.NIGHT_COMPLETE;
    stateTimer = 0;
    if (drone) { drone.stop(); drone = null; }
    return;
  }

  // Power drain
  let drainRate = night.powerDrain;
  if (currentCamera >= 0) drainRate += 0.1;
  if (leftDoorClosed) drainRate += 0.12;
  if (rightDoorClosed) drainRate += 0.12;
  if (leftLightOn) drainRate += 0.06;
  if (rightLightOn) drainRate += 0.06;

  if (!powerOut) {
    power -= drainRate * dt;
    if (power <= 0) {
      power = 0;
      powerOut = true;
      powerOutTimer = 5 + Math.random() * 5;
      leftDoorClosed = false;
      rightDoorClosed = false;
      leftLightOn = false;
      rightLightOn = false;
      currentCamera = -1;
      if (drone) { drone.stop(); drone = null; }
    }
  }

  // Power out countdown
  if (powerOut) {
    powerOutTimer -= dt;
    if (powerOutTimer <= 0) {
      // Random chance to survive
      if (Math.random() < 0.1) {
        gameState = STATE.NIGHT_COMPLETE;
        stateTimer = 0;
      } else {
        triggerJumpscare(animatronics[Math.floor(Math.random() * animatronics.length)]);
      }
      return;
    }
  }

  // Heartbeat when low power
  if (power < 30 && !powerOut) {
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0) {
      playHeartbeat(1 - power / 30);
      heartbeatTimer = 1.5 - (1 - power / 30) * 0.8;
    }
  }

  // Animatronic AI
  for (const anim of animatronics) {
    if (anim.aggression <= 0) continue;

    anim.moveTimer -= dt;
    if (anim.moveTimer <= 0) {
      // Chance to move based on aggression
      const chance = anim.aggression / 10;
      if (Math.random() < chance) {
        // Luigi special: moves faster if being watched
        if (anim.name === 'LUIGI' && currentCamera >= 0 && anim.room === currentCamera) {
          luigiStareTime += 1;
          if (luigiStareTime > 2) {
            anim.pathIdx = Math.min(anim.path.length - 1, anim.pathIdx + 2);
          } else {
            anim.pathIdx = Math.min(anim.path.length - 1, anim.pathIdx + 1);
          }
        } else {
          anim.pathIdx = Math.min(anim.path.length - 1, anim.pathIdx + 1);
        }
        anim.room = anim.path[anim.pathIdx];
        playFootstep();

        // Check if at office
        if (anim.room === 7) {
          const blocked = (anim.side === 'left' && leftDoorClosed) || (anim.side === 'right' && rightDoorClosed);
          if (!blocked) {
            setTimeout(() => {
              if (gameState === STATE.GAMEPLAY) triggerJumpscare(anim);
            }, 500 + Math.random() * 2000);
          } else {
            // Blocked, reset to earlier position
            anim.pathIdx = Math.max(0, anim.pathIdx - 2);
            anim.room = anim.path[anim.pathIdx];
            playDoorSound();
          }
        }
      }
      anim.moveTimer = anim.moveInterval / night.speedMult + Math.random() * 3;
    }
  }

  // Luigi stare reset
  if (currentCamera < 0 || !animatronics[2] || animatronics[2].room !== currentCamera) {
    luigiStareTime = Math.max(0, luigiStareTime - dt * 0.5);
  }

  // Random glitch events
  glitchIntensity = currentNight * 0.08;
  if (Math.random() < 0.005 * (currentNight + 1)) {
    glitchIntensity += 0.3;
  }

  // Creepy messages
  if (Math.random() < 0.002 * (currentNight + 1) && messageTimer <= 0) {
    creepyMessages = [CREEPY_TEXTS[Math.floor(Math.random() * CREEPY_TEXTS.length)]];
    messageTimer = 60;
  }
}

function triggerJumpscare(anim) {
  gameState = STATE.JUMPSCARE;
  jumpscareAnimatronic = anim;
  jumpscareTimer = 45;
  if (drone) { drone.stop(); drone = null; }
  playJumpScare();
}

// ========== MAIN LOOP ==========
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  switch (gameState) {
    case STATE.TITLE:
      drawTitle();
      break;

    case STATE.NIGHT_INTRO:
      drawNightIntro();
      break;

    case STATE.GAMEPLAY:
      updateGameplay(dt);

      if (staticActive) {
        applyStaticTransition();
      } else if (currentCamera >= 0) {
        drawRoom(currentCamera);
        for (const anim of animatronics) drawAnimatronicInRoom(anim, currentCamera);
        // CRT border
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, W-4, H-4);
        // REC indicator
        const blink = Math.floor(Date.now() / 500) % 2;
        if (blink) {
          ctx.fillStyle = '#ff0000';
          ctx.beginPath(); ctx.arc(30, 50, 5, 0, Math.PI*2); ctx.fill();
          drawText('REC', 42, 43, '#ff0000', 12);
        }
        drawCameraMap();
      } else {
        drawOffice();
        if (powerOut) {
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(0, 0, W, H);
          if (Math.floor(Date.now() / 2000) % 3 === 0) {
            drawText('...', W/2, H/2, '#333', 40, 'center');
          }
        }
      }

      drawHUD();
      applyGlitchEffects();
      break;

    case STATE.JUMPSCARE:
      drawJumpscare();
      break;

    case STATE.NIGHT_COMPLETE:
      drawNightComplete();
      break;

    case STATE.GAME_OVER:
      drawGameOver();
      break;

    case STATE.ENDING:
      drawEnding();
      break;
  }

  requestAnimationFrame(gameLoop);
}

// ========== INPUT ==========
canvas.addEventListener('click', (e) => {
  initAudio();

  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  switch (gameState) {
    case STATE.TITLE:
      if (titleTimer > 2) {
        gameState = STATE.NIGHT_INTRO;
        stateTimer = 0;
        currentNight = 0;
        playStatic();
      }
      break;

    case STATE.GAME_OVER:
      if (stateTimer > 1.5) {
        gameState = STATE.NIGHT_INTRO;
        stateTimer = 0;
      }
      break;

    case STATE.ENDING:
      if (endingTimer > 16) {
        gameState = STATE.TITLE;
        titleTimer = 0;
        nightsCompleted = 5;
      }
      break;

    case STATE.GAMEPLAY:
      if (powerOut) break;

      if (currentCamera >= 0) {
        // Click on minimap rooms
        const mapX = 580, mapY = 380;
        for (let i = 0; i < 7; i++) {
          const r = ROOMS[i];
          const rx = mapX + 20 + (r.x / 400) * 160;
          const ry = mapY + 20 + (r.y / 450) * 140;
          if (mx > rx - 15 && mx < rx + 15 && my > ry - 8 && my < ry + 8) {
            switchCamera(i);
            break;
          }
        }
      } else {
        // Office click zones
        // Left door area
        if (mx < 120 && my > 80 && my < 400) {
          leftDoorClosed = !leftDoorClosed;
          playDoorSound();
        }
        // Right door area
        if (mx > 680 && my > 80 && my < 400) {
          rightDoorClosed = !rightDoorClosed;
          playDoorSound();
        }
      }
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (gameState !== STATE.GAMEPLAY || powerOut) return;
  initAudio();

  const key = e.key.toLowerCase();

  // Camera keys
  if (key >= '1' && key <= '7') {
    switchCamera(parseInt(key) - 1);
  }

  // Back to office
  if (key === ' ' || key === 'escape') {
    if (currentCamera >= 0) {
      currentCamera = -1;
      staticActive = true;
      staticTimer = 8;
      playStatic();
    }
    e.preventDefault();
  }

  // Doors
  if (key === 'q') { leftDoorClosed = !leftDoorClosed; playDoorSound(); }
  if (key === 'e') { rightDoorClosed = !rightDoorClosed; playDoorSound(); }

  // Lights
  if (key === 'a') { leftLightOn = !leftLightOn; }
  if (key === 'd') { rightLightOn = !rightLightOn; }
});

function switchCamera(idx) {
  if (idx === currentCamera) return;
  currentCamera = idx;
  staticActive = true;
  staticTimer = 8;
  playStatic();
}

// ========== RESIZE ==========
function resize() {
  const aspect = W / H;
  let cw = window.innerWidth;
  let ch = window.innerHeight;
  if (cw / ch > aspect) {
    cw = ch * aspect;
  } else {
    ch = cw / aspect;
  }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}
window.addEventListener('resize', resize);
resize();

// ========== START ==========
requestAnimationFrame(gameLoop);
</script>
